name: Build Windows EXE

on:
  p:
    branches:
      - main
    paths:
      - 'end_of_sem_algo_explorer/**'

jobs:
  build:
    name: Build and package Windows x64
    runs-on: windows-latest

    outputs:
      artifact_url: ${{ steps.upload.outputs.artifact-url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools and GTK 4
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4

      - name: Build release executable
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build-win -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/dist"
          cmake --build build-win --parallel

      - name: Collect required DLLs and GTK resources
        shell: msys2 {0}
        run: |
          set -euo pipefail
          shopt -s nullglob

          executables=(dist/*.exe)
          if (( ${#executables[@]} == 0 )); then
            echo "::error::CMake produced no executable in dist/"
            exit 1
          fi

          # Start with the app and any DLLs supplied by the project itself.
          queue=("${executables[@]}" dist/*.dll)
          declare -A examined=()
          system_dir="$(cygpath -u "$SYSTEMROOT")/System32"

          for ((i = 0; i < ${#queue[@]}; i++)); do
            binary="${queue[i]}"
            name="${binary##*/}"
            key="${name,,}"
            if [[ -n "${examined[$key]:-}" ]]; then
              continue
            fi
            examined[$key]=1

            imports=$("$MINGW_PREFIX/bin/objdump" -p "$binary" |
              awk '/DLL Name:/ { sub(/\r$/, "", $3); print $3 }')

            while IFS= read -r dll; do
              [[ -n "$dll" ]] || continue

              # Project-provided DLLs were added to the queue above.
              if [[ -f "dist/$dll" ]]; then
                continue
              fi

              if [[ -f "$MINGW_PREFIX/bin/$dll" ]]; then
                cp "$MINGW_PREFIX/bin/$dll" "dist/$dll"
                queue+=("dist/$dll")
                continue
              fi

              # Windows supplies system DLLs and API-set contracts.
              case "${dll,,}" in
                api-ms-win-*|ext-ms-win-*) continue ;;
              esac
              if [[ -f "$system_dir/$dll" ]]; then
                continue
              fi

              echo "::error::$name imports $dll, but it could not be located"
              exit 1
            done <<< "$imports"
          done

          # Keep compiled settings without shipping the schema source files.
          schema_dir="share/glib-2.0/schemas"
          mkdir -p "dist/$schema_dir"
          glib-compile-schemas \
            --targetdir="dist/$schema_dir" "$MINGW_PREFIX/$schema_dir"

          # Keep font configuration and available dependency license notices.
          for dir in etc/fonts share/fontconfig share/licenses; do
            if [[ -d "$MINGW_PREFIX/$dir" ]]; then
              mkdir -p "dist/$dir"
              cp -RL "$MINGW_PREFIX/$dir/." "dist/$dir/"
            fi
          done

          dlls=(dist/*.dll)
          echo "Bundled ${#dlls[@]} DLLs."
          du -sh dist

      - name: Upload portable Windows app
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: algorithm-explorer-windows-x64
          path: dist/
          if-no-files-found: error

      - name: Add download link to workflow summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "[Download Algorithm Explorer for Windows x64]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Extract the ZIP and open the .exe in the extracted folder.' >> "$GITHUB_STEP_SUMMARY"

  comment-on-pr:
    name: Post download link to PR
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Post artifact link
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "Windows x64 build ready. [Download the ZIP]($ARTIFACT_URL), extract it, and run the .exe."